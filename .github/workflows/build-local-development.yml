name: Build local development app

run-name: Development app ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: local-development-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ARM64 development app
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Verify exact commit
        id: commit
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          test "$commit" = '${{ inputs.ref }}'
          printf 'sha=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Build CoreEditor assets
        working-directory: CoreEditor
        run: |
          corepack enable
          yarn install --immutable
          yarn build
      - name: Build ARM64 app without distribution credentials
        env:
          BUILD_COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          xcodebuild build \
            -project MarkEdit.xcodeproj \
            -scheme MarkEditMac \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            KSAMINT_BUILD_COMMIT="$BUILD_COMMIT" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug/kmd.app"
          test -d "$app"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName kmd Dev' "$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = art.apuch.ksamint.markedit.dev
          test "$(/usr/libexec/PlistBuddy -c 'Print :KSAMINTBuildCommit' "$app/Contents/Info.plist")" = "$BUILD_COMMIT"
          lipo -archs "$app/Contents/MacOS/kmd" | grep -Fx arm64

          codesign --force --deep --sign - --timestamp=none "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/kmd-development.zip"
          (cd "$RUNNER_TEMP" && shasum -a 256 kmd-development.zip > kmd-development.zip.sha256)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kmd-development
          path: |
            ${{ runner.temp }}/kmd-development.zip
            ${{ runner.temp }}/kmd-development.zip.sha256
          retention-days: 3
          if-no-files-found: error
