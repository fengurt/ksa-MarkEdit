name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "codex/**"]
    types: [synchronize, opened, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  resource-modules:
    name: Signed resource preview modules
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: ResourceModules/package-lock.json
      - name: Verify signatures, hashes, sandbox policy, and archive parsers
        working-directory: ResourceModules
        run: |
          npm ci
          npm audit --audit-level=high
          npm run verify

  agent-sdk:
    name: Read-only Agent SDK
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: AgentSDK/package-lock.json
      - name: Validate TypeScript SDK
        working-directory: AgentSDK
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm test
          npm run build

  local-agent-cli-contracts:
    name: Local Agent CLI contracts
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Install supported CLI protocol fixtures
        run: >-
          npm install --prefix "$RUNNER_TEMP/agent-clis" --no-package-lock --no-save
          @openai/codex@0.142.5 @anthropic-ai/claude-code@2.1.173
      - name: Validate Codex app-server contract
        run: |
          codex="$RUNNER_TEMP/agent-clis/node_modules/.bin/codex"
          "$codex" --version | grep -F '0.142.5'
          "$codex" app-server --help | grep -F -- '--config'
          "$codex" app-server --help | grep -F -- '--stdio'
      - name: Validate Claude Code stream-json contract
        run: |
          claude="$RUNNER_TEMP/agent-clis/node_modules/.bin/claude"
          "$claude" --version | grep -F '2.1.173'
          "$claude" --help | grep -F -- '--input-format'
          "$claude" --help | grep -F -- '--output-format'
          "$claude" --help | grep -F -- '--permission-mode'
          "$claude" --help | grep -F -- '--mcp-config'

  cloud:
    name: Private cloud and recovery
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Cloud

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check warnings and unsafe regressions
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test protocol, API, and recovery
        run: cargo test --workspace
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --deny warnings
      - name: Validate Tencent sync environment wiring
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          TENCENT_SECRET_ID: ci-secret-id
          TENCENT_SECRET_KEY: ci-secret-key
          TENCENT_STS_ROLE_ARN: qcs::cam::uin/100022600923:roleName/KsamintVaultStsRole
          TENCENT_COS_BUCKET: ksamint-vault-1308586823
          TENCENT_COS_REGION: ap-singapore
          TENCENT_APP_ID: "1308586823"
        run: |
          docker compose -f docker-compose.tencent.yml config > /tmp/ksamint-compose.yml
          grep -F 'TENCENT_SECRET_ID: ci-secret-id' /tmp/ksamint-compose.yml
          grep -F 'TENCENT_SECRET_KEY: ci-secret-key' /tmp/ksamint-compose.yml
          grep -F 'TENCENT_STS_ROLE_ARN: qcs::cam::uin/100022600923:roleName/KsamintVaultStsRole' /tmp/ksamint-compose.yml
          grep -F 'TENCENT_COS_BUCKET: ksamint-vault-1308586823' /tmp/ksamint-compose.yml
          grep -F 'TENCENT_APP_ID: "1308586823"' /tmp/ksamint-compose.yml

  test:
    name: Tests (ARM64, macOS 26)
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: WebApp/package-lock.json

      - name: Validate localizations
        run: node Scripts/validate-localizations.mjs

      - name: Build and test CoreEditor
        working-directory: CoreEditor
        run: |
          corepack enable
          yarn install --immutable
          yarn npm audit --severity high --all
          yarn build
          yarn test

      - name: Build and test Web PWA
        working-directory: WebApp
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm test
          npm run build
          npm run build:mac
          npm run validate:mac-bundle

      - name: Build ksamint MarkEdit
        run: |
          xcodebuild build \
            -project MarkEdit.xcodeproj \
            -scheme MarkEditMac \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Test Swift packages
        run: |
          swift test --package-path MarkEditKit
          xcodebuild test \
            -project MarkEdit.xcodeproj \
            -scheme MarkEditCoreTests \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          xcodebuild test \
            -project MarkEdit.xcodeproj \
            -scheme ModulesTests \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

  compatibility:
    name: macOS 15 ARM64 compatibility
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Build CoreEditor
        working-directory: CoreEditor
        run: |
          corepack enable
          yarn install --immutable
          yarn build
      - name: Build Web PWA
        working-directory: WebApp
        run: |
          npm ci
          npm run build
          npm run build:mac
          npm run validate:mac-bundle
      - name: Build deployment-target release
        run: |
          xcodebuild build \
            -project MarkEdit.xcodeproj \
            -scheme MarkEditMac \
            -configuration Release \
            -destination 'platform=macOS' \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

  development-artifact:
    name: ARM64 development app
    needs: [test, compatibility, resource-modules, local-agent-cli-contracts]
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Build CoreEditor
        working-directory: CoreEditor
        run: |
          corepack enable
          yarn install --immutable
          yarn build
      - name: Build Web PWA
        working-directory: WebApp
        run: |
          npm ci
          npm run build
          npm run build:mac
          npm run validate:mac-bundle
      - name: Build ARM64 app
        run: |
          xcodebuild build \
            -project MarkEdit.xcodeproj \
            -scheme MarkEditMac \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -destination 'generic/platform=macOS' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_OPTIMIZATION_LEVEL="-Osize" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release/ksamint MarkEdit.app"
          strip "$app/Contents/MacOS/ksamint MarkEdit"
          strip "$app/Contents/PlugIns/FinderExtension.appex/Contents/MacOS/FinderExtension"
          strip "$app/Contents/PlugIns/PreviewExtension.appex/Contents/MacOS/PreviewExtension"
          strip "$app/Contents/PlugIns/QuickActionExtension.appex/Contents/MacOS/QuickActionExtension"
          strip "$app/Contents/Library/LoginItems/ConversationCaptureHelper.app/Contents/MacOS/ConversationCaptureHelper"
          codesign --force --deep --sign - "$app"
          hdiutil create \
            -volname "ksamint MarkEdit" \
            -srcfolder "$app" \
            -ov \
            -format UDBZ \
            "$RUNNER_TEMP/ksamint-MarkEdit-size-check.dmg"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/ksamint-MarkEdit-development.zip"
          dmg_size="$(stat -f '%z' "$RUNNER_TEMP/ksamint-MarkEdit-size-check.dmg")"
          release_limit=6291456
          required_margin=102400
          ci_limit="$((release_limit - required_margin))"
          echo "ARM64 UDBZ size: $dmg_size bytes (CI limit: $ci_limit; release limit: $release_limit)"
          test "$dmg_size" -le "$ci_limit"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ksamint-MarkEdit-development
          path: |
            ${{ runner.temp }}/ksamint-MarkEdit-development.zip
            ${{ runner.temp }}/ksamint-MarkEdit-size-check.dmg
          if-no-files-found: error
