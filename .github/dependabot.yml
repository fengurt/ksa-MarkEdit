version: 2
updates:
  - package-ecosystem: npm
    directory: /WebApp
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    groups:
      runtime:
        dependency-type: production
      development:
        dependency-type: development

  - package-ecosystem: npm
    directory: /AgentSDK
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    groups:
      runtime:
        dependency-type: production
      development:
        dependency-type: development

  - package-ecosystem: npm
    directory: /CoreEditor
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    groups:
      runtime:
        dependency-type: production
      development:
        dependency-type: development

  - package-ecosystem: npm
    directory: /ResourceModules
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    groups:
      runtime:
        dependency-type: production
      development:
        dependency-type: development

  - package-ecosystem: cargo
    directory: /Cloud
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    groups:
      compatible-patches:
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /Cloud
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    groups:
      cloud-images:
        patterns: ["*"]
