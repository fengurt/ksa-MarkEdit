name: ksamint

services:
  database:
    image: postgres:17-alpine
    container_name: ksamint-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ksamint
      POSTGRES_USER: ksamint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ksamint -d ksamint"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
    container_name: ksamint-api
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ksamint:${POSTGRES_PASSWORD}@database:5432/ksamint
      KSAMINT_BIND: 0.0.0.0:8080
      KSAMINT_PUBLIC_ORIGIN: https://notes.apuch.cn
      KSAMINT_RP_ID: notes.apuch.cn
      KSAMINT_ALLOW_REGISTRATION: ${KSAMINT_ALLOW_REGISTRATION:-true}
      TENCENT_SECRET_ID: ${TENCENT_SECRET_ID:?TENCENT_SECRET_ID is required}
      TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY:?TENCENT_SECRET_KEY is required}
      TENCENT_STS_ROLE_ARN: ${TENCENT_STS_ROLE_ARN:?TENCENT_STS_ROLE_ARN is required}
      TENCENT_COS_BUCKET: ${TENCENT_COS_BUCKET:?TENCENT_COS_BUCKET is required}
      TENCENT_COS_REGION: ${TENCENT_COS_REGION:-ap-singapore}
      TENCENT_APP_ID: ${TENCENT_APP_ID:?TENCENT_APP_ID is required}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_PEM: ${GITHUB_APP_PRIVATE_KEY_PEM:-}
      RUST_LOG: ksamint_api=info,tower_http=info
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true

  web:
    image: nginx:1.27-alpine
    container_name: ksamint-web
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ../WebApp/dist:/usr/share/nginx/html:ro
      - ./nginx.tencent.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,noexec,nosuid
      - /var/run:size=1m,noexec,nosuid
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
